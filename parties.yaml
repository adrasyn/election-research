# ───────────────────────────────────────────────────────────────────
# Australian political party colour registry
# ───────────────────────────────────────────────────────────────────
# Single source of truth for the dashboard's party identification.
# The data pipeline joins this against AEC media-feed `PartyIdentifier`
# elements to attach a stable display name, abbreviation and colour.
#
# Schema per entry:
#   aec_code       : The party abbreviation as the AEC media feed emits
#                    it. BEST GUESS in many cases — verify against the
#                    real feed when the pipeline goes live. Items marked
#                    "# REVIEW" need human confirmation.
#   aec_name       : Full registered name in the AEC register. Best
#                    guess, also subject to verification.
#   display        : Short label shown in UI (≤ 16 chars where possible).
#   abbr           : Three-letter brand abbreviation (may differ from
#                    aec_code, e.g. "LIB" displayed but "LP" in feed).
#   colour         : Hex used by the dashboard. Calibrated for the
#                    charcoal dark background (#0a0d11). Derived from
#                    the canonical Wikipedia template colour at ~70%
#                    saturation and adjusted for distinguishability
#                    against neighbouring parties.
#   colour_canon   : Hex from Wikipedia's
#                    Template:Australian_politics/party_colours.
#                    Reference only; do NOT use directly in dashboard.
#   colour_soft    : rgba(...) with ~16% alpha for use as background
#                    tint. Mirrors the existing --alp-soft pattern.
#   aliases        : Alternate names (rebrands, common short forms,
#                    historical AEC codes). Used by the join.
#   category       : major | minor | independent | other
#   active         : true if currently registered with the AEC (as of
#                    the 2025 federal election).
#   notes          : Optional commentary, especially for rebrands.
# ───────────────────────────────────────────────────────────────────

parties:

  # ═══════════════ MAJOR PARTIES ═══════════════

  - aec_code: ALP
    aec_name: Australian Labor Party
    display: Labor
    abbr: ALP
    colour: "#d4253a"
    colour_canon: "#F00011"
    colour_soft: "rgba(212, 37, 58, 0.16)"
    aliases: [Labor, Labour, ALP, Australian Labor Party]
    category: major
    active: true

  - aec_code: LP
    aec_name: Liberal Party of Australia
    display: Liberal
    abbr: LIB
    colour: "#1746a8"
    colour_canon: "#080CAB"
    colour_soft: "rgba(23, 70, 168, 0.16)"
    aliases: [Liberal, LP, LIB, Liberal Party]
    category: major
    coalition_family: liberal
    active: true

  - aec_code: LNP   # REVIEW: AEC may use "LNP" or "LNQ" historically
    aec_name: Liberal National Party of Queensland
    display: LNP
    abbr: LNP
    colour: "#2167cb"           # slightly lighter blue than LP
    colour_canon: "#1456F1"
    colour_soft: "rgba(33, 103, 203, 0.16)"
    aliases: [Liberal National, LNP, LNQ]
    category: major
    coalition_family: liberal
    active: true
    notes: |
      Queensland-specific Lib/Nat merger (2008). Functionally part of
      the federal Coalition with LP and NP. Kept distinct so seat
      identity is preserved in data.

  - aec_code: NP    # REVIEW: AEC code might be "NAT" — confirm
    aec_name: National Party of Australia
    display: Nationals
    abbr: NAT
    colour: "#1d7846"           # green-with-blue-bias to separate from GRN
    colour_canon: "#008000"     # named CSS "green" in template
    colour_soft: "rgba(29, 120, 70, 0.16)"
    aliases: [Nationals, National, NP, NAT, National Party]
    category: major
    coalition_family: nationals  # ONLY the Nationals retain rural-Coalition green
    active: true
    notes: |
      Federal Coalition partner with LP and LNP. Wikipedia uses
      named CSS green (#008000), too dark on charcoal — shifted
      slightly toward teal to differentiate from Greens. The
      Nationals are the ONLY Coalition member that stays green —
      LP, LNP and CLP all sit in the Coalition blue family.

  - aec_code: CLP
    aec_name: Country Liberal Party (NT)
    display: CLP
    abbr: CLP
    colour: "#2980d4"           # Coalition blue (slightly cyan to differ from LP/LNP)
    colour_canon: "#FF7F00"     # Wikipedia uses orange — overridden per project decision
    colour_soft: "rgba(41, 128, 212, 0.16)"
    aliases: [Country Liberal, CLP]
    category: major
    coalition_family: liberal   # groups LP + LNP + CLP visually
    active: true
    notes: |
      NT Coalition partner. Wikipedia canon is orange, but per project
      decision (2026-05-08) all Liberal-aligned Coalition parties
      (LP, LNP, CLP) sit in the blue family. Only the Nationals (NP)
      retain their distinct rural-Coalition green.

  - aec_code: GRN   # REVIEW: AEC code might be "AG" — confirm
    aec_name: Australian Greens
    display: Greens
    abbr: GRN
    colour: "#2da050"
    colour_canon: "#10C25B"
    colour_soft: "rgba(45, 160, 80, 0.16)"
    aliases: [Greens, Australian Greens, GRN, AG]
    category: major
    active: true

