# ───────────────────────────────────────────────────────────────────
# REVIEW TASKS BEFORE SHIPPING
# ───────────────────────────────────────────────────────────────────
# 1. Verify every aec_code marked "# REVIEW" against the real AEC media
#    feed by parsing the 2022 archive's eml-110 message and listing all
#    PartyIdentifier ShortCode values that appear.
# 2. Add any party that appears in the feed but isn't above.
# 3. The colour_canon values come from Wikipedia's template — they're
#    Wikipedia-curated, not AEC-official. Where a party has a published
#    brand guide (most majors do), prefer the brand guide.
# 4. Add a per-candidate override file (candidate_overrides.yaml) IF
#    we ever want non-default colours per individual (e.g. a high-
#    profile independent with their own brand). Per user direction
#    above, Teals do NOT get overrides.
