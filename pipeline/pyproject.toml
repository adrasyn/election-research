[project]
name = "aec-pipeline"
version = "0.1.0"
description = "Data pipeline for the AEC elections research dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "httpx>=0.28",
    "click>=8.1",
    "platformdirs>=4.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
aec-pipeline = "aec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "RUF"]
